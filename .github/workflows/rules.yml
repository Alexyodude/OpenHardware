name: rules

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Check out the branch itself, never GitHub's synthetic PR merge commit.
      #
      # On a `pull_request` event the default checkout is head merged into base,
      # and base carries whatever upstream has committed since `fork-point`.
      # `check_deltas.py` then sees upstream's own edits inside `fork-point..HEAD`
      # and reports them as unlogged modifications of ours: the first PR opened
      # against this fork failed with eight, which were byte-for-byte the eight
      # files upstream touched in the two commits it made after the fork.
      #
      # The rule's subject is what THIS fork changed, so the tree it is measured
      # against must contain only this fork's commits. On `push` the expression
      # is empty and checkout falls back to the pushed ref.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Fetch fork-point tag
        run: git fetch --tags --force

      - name: Verify fork-point tag resolves
        run: |
          if ! git rev-parse --verify --quiet fork-point >/dev/null; then
            echo "::error::Tag 'fork-point' is missing from this remote. Tags are not carried by an ordinary branch push -- push it explicitly with: git push <remote> fork-point" >&2
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install pytest==9.0.2 PyYAML==6.0.3 websockets==15.0.1

      - name: check_layering
        run: python tools/check_layering.py

      - name: check_board_contract
        run: python tools/check_board_contract.py

      - name: check_part_schemas
        run: python tools/check_part_schemas.py

      - name: check_licenses
        run: python tools/check_licenses.py

      - name: check_deltas
        run: python tools/check_deltas.py

      - name: check_banned_symbols
        run: python tools/check_banned_symbols.py

      - name: rules test suite
        run: pytest tests/rules/ -v

      - name: webui test suite
        run: pytest tests/webui/ -v
