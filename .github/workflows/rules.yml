name: rules

on:
  push:
    branches: ["**"]
  pull_request:

env:
  # Every checker that reads upstream C++ resolves through webui/picsimlab.py,
  # which honours this. Without it those checkers exit 3 (SKIPPED) and the job
  # fails -- deliberately: a rules run that silently checked nothing is the
  # vacuous green this repository exists to prevent.
  PICSIMLAB_ROOT: ${{ github.workspace }}/../picsimlab-reference

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # A plain checkout is correct again.
      #
      # While this was a fork, `check_deltas.py` diffed against a `fork-point`
      # tag, and on a `pull_request` event the default checkout is head merged
      # into base -- base carrying upstream's own post-fork commits, which the
      # checker then reported as eight unlogged modifications of ours. The
      # workaround was to check out the PR head instead.
      #
      # Both the tag and the bug are gone: upstream is no longer in this tree,
      # and an upstream change is now a file in patches/, which no merge can
      # fabricate. See rules/upstream-sync.md section 1.
      - uses: actions/checkout@v4

      # Shallow: the checkers read files, never history. This is ~90 MB and the
      # single slowest step in the job, so it is worth not deepening it.
      - name: Clone the PICSimLab reference
        run: |
          git clone --depth 1 https://github.com/lcgamboa/picsimlab \
            "${{ github.workspace }}/../picsimlab-reference"

      - name: Verify the reference resolves
        run: |
          python -c "
          from webui import picsimlab
          print('install:', picsimlab.install_root())
          print('source: ', picsimlab.source_root())
          "

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install pytest==9.0.2 PyYAML==6.0.3 websockets==15.0.1

      # The native core. This is the only place g++ ever sees it -- the
      # development machine is Windows and MSVC, so a warning or an error that
      # only GCC raises would otherwise reach master unseen.
      - name: Build the i8086 core
        run: python tools/build_core.py

      # A representative slice of the hardware corpus: one opcode from each
      # family the core implements. ~14 MB rather than the full 2 GB, and it
      # is 90,000 silicon-captured cases -- the eleven committed fixtures are
      # a smoke test, this is the real check. It was a fetch like this that
      # found AF being cleared on logical operations, which the fixtures could
      # not see.
      - name: Fetch a corpus slice
        run: bash tools/get_8088_tests.sh --opcodes 00 09 21 29 31 39 50 58 74 8B

      - name: Core suite
        run: pytest tests/i8086/ -v

      # Informational, not a gate. Prints the pass rate against the committed
      # eleven-case excerpt so the number is visible in every run as slices
      # land. It is 0% until OH-3 executes anything, and saying so out loud is
      # the point -- a harness with no core to run must not look like a pass.
      - name: Conformance baseline
        run: python tests/i8086/conformance.py --failures 0

      - name: check_layering
        run: python tools/check_layering.py

      - name: check_board_contract
        run: python tools/check_board_contract.py

      - name: check_part_schemas
        run: python tools/check_part_schemas.py

      - name: check_licenses
        run: python tools/check_licenses.py

      - name: check_deltas
        run: python tools/check_deltas.py

      - name: check_banned_symbols
        run: python tools/check_banned_symbols.py

      # Ticket collisions do not need PICSimLab or the reference checkout;
      # they are a property of docs/tickets/ and the working tree alone.
      - name: check_ticket_claims
        run: python tools/check_ticket_claims.py

      # The guard is a PreToolUse hook and cannot run in CI, so its own
      # self-test is what keeps it honest here.
      - name: ticket_guard self-test
        run: python tools/ticket_guard.py --self-test

      # The patches must still apply to whatever upstream is today. This is the
      # only thing that notices when they rot, and it costs a second.
      - name: patches still apply
        run: tools/apply_patches.sh

      - name: rules test suite
        run: pytest tests/rules/ -v

      - name: webui test suite
        run: pytest tests/webui/ -v
