# OpenHardware - the emulator page as a static site on GitHub Pages (OH-242).
#
# SPDX-License-Identifier: MIT
# Copyright (c) 2026 the OpenHardware authors. See LICENSE.
#
# Builds build/site with tools/build_site.py, holds it to the tests that
# check a built site, and deploys that folder. The page then runs entirely in
# the visitor's tab: there is no server behind it, so nothing here has a
# secret to hold and the deploy job's only rights are Pages'.
#
# Served at https://alexyodude.com/OpenHardware/ -- the owner's user site
# (Alexyodude.github.io) carries the custom domain, and a project site sits
# under it at the repository's name. No DNS record changes for this.
#
# ## When it runs
#
# On a v* tag, and by hand. Not on every push: what is on the page is a
# release, and the tag must name the version pyproject.toml states.
#
# ## Before the first run, the operator's two steps
#
#   1. Settings > Pages > Source: "GitHub Actions".
#   2. Settings > Environments > github-pages > Deployment branches and tags:
#      add the tag rule `v*`. The environment GitHub creates allows only the
#      default branch, and refuses a deploy from a tag until it is told.
#
# docs/releases/publishing.md gives both as `gh api` commands, and the rest
# of publishing a release.

name: Pages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# One build at a time, as tools/build_site.py's own lock says for a machine;
# and never cancel a deploy half way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    # The site build compiles two GCCs to WebAssembly in Docker from nothing
    # on every run (tools/build_compiler.py): on an eight-thread desktop,
    # from new Docker volumes, 616 s for the AVR toolchain with its bundle
    # and 11 min for the Arm one (docs/research/web-compile/README.md), and
    # it fetches about 380 MB of pinned sources and releases. A hosted runner
    # has four cores, so twice that is the guess; no run of this workflow has
    # measured it yet, and nothing is cached between runs.
    timeout-minutes: 150
    steps:
      # Nothing later pushes, so the token is not left in .git/config
      # for the steps after this one to find.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # test_site_pyodide boots the built bundle under node.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: The tag names the version pyproject.toml states
        if: github.ref_type == 'tag'
        run: |
          stated=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$GITHUB_REF_NAME" != "v$stated" ]; then
            echo "::error::the tag is $GITHUB_REF_NAME and pyproject.toml says $stated"
            exit 1
          fi

      # The Emscripten Pyodide was built with, and no other: a side module
      # from another one does not link. The version lives once, in
      # tools/build_site.py, which checks it again before compiling.
      - name: Emscripten
        run: |
          version=$(python -c "from tools import build_site; print(build_site.EMSCRIPTEN_VERSION)")
          git clone --depth 1 --branch "$version" https://github.com/emscripten-core/emsdk third_party/emsdk
          third_party/emsdk/emsdk install "$version"
          third_party/emsdk/emsdk activate "$version"

      - name: Python tools
        run: |
          pip install pytest==9.0.2 playwright==1.64.0
          python -m playwright install --with-deps chromium

      # The native cores, which test_inpage and test_site_pyodide hold the
      # page's answers to.
      - name: Build the cores
        run: python tools/build_core.py

      # And the compiler the page builds sketches with (OH-244): GCC built
      # for WebAssembly in the runner's Docker, from the sources
      # tools/build_compiler.py pins, and the Arduino core compiled with it
      # under node.
      - name: Build the site
        run: python tools/build_site.py

      # The page says which commit it was built from, and a checkout
      # here is clean, so "with local changes" means a step above
      # wrote into a file the site ships.
      - name: The page states a clean commit
        run: |
          if grep -q "with local changes" build/site/index.html; then
            echo "::error::the page says it was built from local changes"
            exit 1
          fi

      # Uploaded before the tests run, so what deploys is what was built:
      # nothing the tests' tools run can change it. A failed test still
      # fails this job, and the deploy job needs it.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/site

      # A skip here is a failure: each of these skips by name when node,
      # Chromium, a core or the build is missing, and every one of them is
      # installed above, so a skip means a step above did not do its job.
      #
      # `shell: bash` is what sets pipefail. A step with no shell named runs
      # `bash -e`, which takes `tee`'s status for the pipe's, and a failing
      # test with no skip beside it would pass the step.
      - name: Check the built site
        shell: bash
        run: |
          python -m pytest -q -rs \
            tests/webui/test_inpage.py \
            tests/webui/test_site_build.py \
            tests/webui/test_site_pyodide.py \
            tests/webui/test_site_browser.py \
            tests/webui/test_compiler_page.py | tee site-tests.log
          if grep -q SKIPPED site-tests.log; then
            echo "::error::a site test skipped; see the reasons above"
            exit 1
          fi

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
